
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Google Fonts: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- External CSS -->
<link rel="stylesheet" href="styles.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Disease Scavenger</title>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white text-center p-4">

                    <h2>
                        <i class="bi bi-heart-pulse-fill"></i>
                        MEDICURIO
                    </h2>

                    <p class="mb-0">
                       Your charmable disease scavenger! ( ꩜ ᯅ ꩜;)⁭ ⁭
                    </p>

                </div>

                <div class="card-body p-4">

                    <div class="alert alert-info">
                        <strong>Instructions:</strong><br>
                        Enter the <b>name</b> of a disease. (hope you don't have it! (ó﹏ò｡))
                        Example: Dengue, Malaria, Tuberculosis. 
                    </div>

                    <form>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                <i class="bi bi-search"></i>
                                Disease Name ( o ཀ 0 )
                            </label>

                            <input
                                type="text"
                                id="disease_name"
                                class="form-control form-control-lg"
                                placeholder="Enter the disease name here...">

                        </div>

                        <div class="d-grid">

                            <input
                                type="button"
                                py-click="disease_checker"
                                value="Check Details"
                                class="btn btn-success btn-lg">

                        </div>

                    </form>

                    <hr>

                    <h5 class="text-primary">
                        <i class="bi bi-card-list"></i>
                        Result
                    </h5>

                    <div id="result" class="rounded p-3 shadow-sm">

                    </div>

                </div>

                <div class="card-footer bg-light text-center footer-text">

                    <i class="bi bi-lightbulb-fill text-warning"></i>
                    Skills Test • 2nd Quarter • Larissa Julia Ferrer

                </div>

            </div>

        </div>

    </div>

</div>

<py-script src="main.py"></py-script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
